name: refresh hours

# RecSports edits its hours page whenever a holiday or break comes up, and
# their page sends no CORS header, so the browser cannot read it directly.
# This re-scrapes every morning and commits only hours.json, which the page
# fetches from raw.githubusercontent.com when it opens. The commit message
# carries [skip netlify], so this never triggers a Netlify deploy (each deploy
# costs 15 credits; pushing daily used up the free plan). index.html keeps a
# baked-in copy as a fallback, refreshed whenever the site is deployed by hand.
# No Netlify credentials live here.
#
# If the scrape comes back wrong the job fails, nothing is pushed, and the last
# good deploy stays up. GitHub emails you when a scheduled job fails.
on:
  schedule:
    - cron: "30 11 * * *"      # 11:30 UTC = 6:30 ET in winter, 7:30 ET in summer
  workflow_dispatch:            # and a "Run workflow" button for when you want it now

concurrency:
  group: refresh-hours
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # to commit the refreshed hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape recsports.ufl.edu
        run: python3 hours.py

      - name: Refuse a bad scrape
        run: python3 check-hours.py

      - name: Write hours.json
        run: |
          python3 export-hours.py
          git checkout -- index.html    # the site itself stays untouched

      - name: Commit hours.json (no Netlify deploy)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- hours.json; then
            echo "hours.json unchanged"
          else
            git add hours.json
            git commit -m "hours: refresh from recsports.ufl.edu [skip netlify]"
            git push
            echo "pushed hours.json - Netlify skips this commit"
          fi
