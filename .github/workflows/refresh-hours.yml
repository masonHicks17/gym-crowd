name: refresh hours

# RecSports edits its hours page whenever a holiday or break comes up, and the
# dashboard carries a baked-in copy of it (their page sends no CORS header, so
# the browser cannot read it at runtime). This re-scrapes every morning and
# commits the result; Netlify is connected to this repo, so the push is what
# deploys it. No Netlify credentials live here.
#
# If the scrape comes back wrong the job fails, nothing is pushed, and the last
# good deploy stays up. GitHub emails you when a scheduled job fails.
on:
  schedule:
    - cron: "30 11 * * *"      # 11:30 UTC = 6:30 ET in winter, 7:30 ET in summer
  workflow_dispatch:            # and a "Run workflow" button for when you want it now

concurrency:
  group: refresh-hours
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # to commit the refreshed hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape recsports.ufl.edu
        run: python3 hours.py

      - name: Refuse a bad scrape
        run: python3 check-hours.py

      - name: Build
        run: python3 build.py

      - name: Commit and push if the hours moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html dist/; then
            echo "hours unchanged - nothing to deploy"
          else
            git add index.html dist/
            git commit -m "hours: refresh from recsports.ufl.edu"
            git push
            echo "pushed - Netlify will deploy"
          fi
