# Netlify builds this repo on every push to main.
#
# There is no build command: the GitHub Action runs the scraper and commits
# dist/, so Netlify only has to serve it. That keeps Python out of the build
# image and means a broken scrape can never take the site down - the Action
# fails, nothing is pushed, and the last good deploy stays up.

#
# Each production deploy costs 15 credits, so only build when something the
# site actually serves changed. The daily hours commit touches hours.json only
# (and carries [skip netlify] anyway), so it never deploys. `ignore` exits 0
# to skip the build.

[build]
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- dist netlify netlify.toml package.json package-lock.json"

# Visit counting, served from this domain. Same-origin, so ad blockers do not
# suppress it the way they do a third-party analytics script.
[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/hit"
  status = 200

[[redirects]]
  from = "/stats"
  to = "/.netlify/functions/stats"
  status = 200
